<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Tracker - Privates Projekt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .info-label {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            color: #e0e0e0;
            word-break: break-all;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-save {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #000;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #f44336;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 IP Tracker</h1>
        <p class="subtitle">Privates Testprojekt</p>

        <!-- Meldung für Benutzer -->
        <div id="message" class="message"></div>

        <!-- Anzeige der erkannten IP-Adresse -->
        <div class="info-box">
            <div class="info-label">Ihre aktuelle IP-Adresse:</div>
            <div class="info-value" id="ipDisplay">Wird geladen...</div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn-save" onclick="saveIP()">💾 IP Speichern</button>
            <button class="btn-clear" onclick="clearMessage()">🗑️ Zurücksetzen</button>
        </div>

        <div class="footer">
            ℹ️ Diese Daten werden nur lokal gespeichert (private Verwendung)
        </div>
    </div>

    <script>
        // IP-Adresse beim Laden der Seite abrufen
        let userIP = '';

        document.addEventListener('DOMContentLoaded', function() {
            fetchIP();
        });

        // Funktion zum Abrufen der öffentlichen IP-Adresse
        function fetchIP() {
            // Externe API verwenden, um die öffentliche IP zu erkennen
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    userIP = data.ip;
                    document.getElementById('ipDisplay').textContent = userIP;
                })
                .catch(error => {
                    console.error('Fehler beim Abrufen der IP:', error);
                    document.getElementById('ipDisplay').textContent = 'IP konnte nicht abgerufen werden';
                });
        }

        // Funktion zum Speichern der IP
        async function saveIP() {
            if (!userIP) {
                showMessage('Fehler: IP-Adresse konnte nicht ermittelt werden', 'error');
                return;
            }

            try {
                // POST-Anfrage an den Server senden
                // Der Server speichert die IP und das Datum in der ips.json Datei
                const response = await fetch('/api/save-ip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ip: userIP,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    showMessage('✅ IP-Adresse erfolgreich gespeichert!', 'success');
                } else {
                    showMessage('❌ Fehler beim Speichern', 'error');
                }
            } catch (error) {
                console.error('Fehler:', error);
                showMessage('❌ Verbindungsfehler', 'error');
            }
        }

        // Funktion zur Anzeige von Meldungen
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;

            // Nach 4 Sekunden ausblenden
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 4000);
        }

        // Funktion zum Löschen der Meldung
        function clearMessage() {
            document.getElementById('message').classList.remove('show');
        }
    </script>
</body>
</html>
